<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artisans Hub - Login</title>
</head>
<body>
  <h2>Welcome to Artisans Hub</h2>

  <!-- Role Selection -->
  <p>Select your role:</p>
  <label><input type="radio" name="role" value="artist" checked> Artist</label>
  <label><input type="radio" name="role" value="buyer"> Buyer</label>
  <br><br>

  <!-- Email/Password Form -->
  <input type="email" id="email" placeholder="Enter email"><br><br>
  <input type="password" id="password" placeholder="Enter password"><br><br>
  <button onclick="signUp()">Sign Up</button>
  <button onclick="login()">Login</button>
  <br><br>

  <!-- Google Login -->
  <button onclick="googleLogin()">Sign in with Google</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signInWithPopup, 
      GoogleAuthProvider 
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    // ✅ Firebase config (replace with your project config)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // 🟢 Sign Up
    window.signUp = function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const role = document.querySelector('input[name="role"]:checked').value;

      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          alert("Account created: " + userCredential.user.email);

          // Redirect after signup
          if (role === "artist") {
            window.location.href = "artist-dashboard.html";
          } else {
            window.location.href = "buyer-dashboard.html";
          }
        })
        .catch((error) => {
          alert(error.message);
        });
    };

    // 🟢 Login
    window.login = function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const role = document.querySelector('input[name="role"]:checked').value;

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          alert("Welcome back: " + userCredential.user.email);

          // Redirect after login
          if (role === "artist") {
            window.location.href = "artist-dashboard.html";
          } else {
            window.location.href = "buyer-dashboard.html";
          }
        })
        .catch((error) => {
          alert(error.message);
        });
    };

    // 🟢 Google Login
    window.googleLogin = function () {
      const role = document.querySelector('input[name="role"]:checked').value;

      signInWithPopup(auth, provider)
        .then((result) => {
          alert("Logged in as: " + result.user.email);

          // Redirect after Google login
          if (role === "artist") {
            window.location.href = "artist-dashboard.html";
          } else {
            window.location.href = "buyer-dashboard.html";
          }
        })
        .catch((error) => {
          alert(error.message);
        });
    };
  </script>
</body>
</html>
