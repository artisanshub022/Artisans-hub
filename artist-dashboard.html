<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Dashboard</title>
</head>
<body>
  <h2>Upload Your Artwork</h2>

  <input type="text" id="artworkName" placeholder="Artwork Name"><br><br>
  <textarea id="artworkDescription" placeholder="Description"></textarea><br><br>
  <input type="number" id="artworkPrice" placeholder="Price"><br><br>
  <input type="text" id="artworkCustomization" placeholder="Customization (Yes/No)"><br><br>
  <input type="file" id="artworkImage"><br><br>

  <button onclick="uploadArtwork()">Upload</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

    // ✅ Firebase config (apna config yaha daalo)
   const firebaseConfig = {
  apiKey: "AIzaSyCMmD7_XeioZvc724W_xCJsAYBOkQsYo48",
  authDomain: "artisans-hub-8743b.firebaseapp.com",
  projectId: "artisans-hub-8743b",
  storageBucket: "artisans-hub-8743b.firebasestorage.app",
  messagingSenderId: "737901091935",
  appId: "1:737901091935:web:bc8c245ebebbdac6434fea"
};
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    async function uploadArtwork() {
      const name = document.getElementById("artworkName").value;
      const description = document.getElementById("artworkDescription").value;
      const price = document.getElementById("artworkPrice").value;
      const customization = document.getElementById("artworkCustomization").value;
      const file = document.getElementById("artworkImage").files[0];

      if (!file) {
        alert("Please select an image!");
        return;
      }

      // 🖼 Upload image to Firebase Storage
      const storageRef = ref(storage, "artworks/" + file.name);
      await uploadBytes(storageRef, file);
      const imageUrl = await getDownloadURL(storageRef);

      // 📝 Save artwork details in Firestore
      await addDoc(collection(db, "artworks"), {
        name,
        description,
        price,
        customization,
        imageUrl
      });

      alert("Artwork uploaded successfully!");
    }
  </script>
</body>
</html>
